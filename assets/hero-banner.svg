<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none">
  <defs>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="258" rx="16" />
    </clipPath>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="auraBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="260" fill="#0D1117" />
    <rect x="0" y="0" width="1200" height="260" fill="url(#subtleGrid)" />
    <ellipse cx="950" cy="80" rx="340" ry="180" fill="url(#auraBlue)" />
    <ellipse cx="1060" cy="180" rx="300" ry="160" fill="url(#auraPurple)" />
    <ellipse cx="780" cy="210" rx="280" ry="130" fill="url(#auraCyan)" />

    <!-- Right-side stylized Dynamic Notch hardware motif -->
    <g transform="translate(835, 42)">
      <rect x="0" y="0" width="315" height="176" rx="14" fill="#161B22" fill-opacity="0.88" stroke="#30363D" stroke-width="1" />
      <!-- Top pill inside motif -->
      <rect x="78" y="14" width="160" height="28" rx="14" fill="#010409" stroke="#30363D" stroke-width="1" />
      <circle cx="96" cy="28" r="4" fill="#30D158" />
      <text x="108" y="32" fill="#E6EDF3" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C# · Win32 · 240Hz</text>

      <!-- Mini bars inside motif card -->
      <rect x="20" y="60" width="130" height="44" rx="8" fill="#0D1117" stroke="#21262D" />
      <text x="32" y="79" fill="#8B949E" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SYSTEM CORE</text>
      <text x="32" y="96" fill="#58A6FF" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">.NET 8 / COM</text>

      <rect x="164" y="60" width="131" height="44" rx="8" fill="#0D1117" stroke="#21262D" />
      <text x="176" y="79" fill="#8B949E" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IDLE CPU</text>
      <text x="176" y="96" fill="#30D158" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">0.02% – 0.05%</text>

      <rect x="20" y="114" width="275" height="44" rx="8" fill="#0D1117" stroke="#21262D" />
      <text x="32" y="133" fill="#8B949E" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FEATURED ARCHITECTURE</text>
      <text x="32" y="150" fill="#E6EDF3" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">DinamikAda · Zero-WebView Island</text>
    </g>

    <!-- Left Identity Block -->
    <text x="52" y="68" fill="#58A6FF" font-size="12.5" font-weight="600" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SOFTWARE ENGINEER · DESKTOP SYSTEMS &amp; PRODUCT ENGINEERING</text>
    <text x="52" y="124" fill="#F0F6FC" font-size="38" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Muhammet Emre Akyüz</text>
    <text x="52" y="160" fill="#8B949E" font-size="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Building low-overhead Windows software (C# 12 · .NET 8 · Win32/COM) and full-stack products.</text>

    <!-- Status Chips -->
    <rect x="52" y="186" width="268" height="32" rx="16" fill="#161B22" stroke="#30363D" />
    <circle cx="72" cy="202" r="4.5" fill="#30D158" />
    <text x="85" y="206" fill="#E6EDF3" font-size="12.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Open to engineering collaborations</text>

    <rect x="332" y="186" width="102" height="32" rx="16" fill="#161B22" stroke="#30363D" />
    <text x="355" y="206" fill="#C9D1D9" font-size="12.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Türkiye</text>

    <rect x="446" y="186" width="228" height="32" rx="16" fill="#161B22" stroke="#30363D" />
    <text x="466" y="206" fill="#58A6FF" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@escompanystudio-base</text>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="16" stroke="url(#borderGrad)" stroke-width="1.2" />
</svg>
